services:
  artex-kali-audit:
    image: artex-kali-audit:feat-code-audit-v3
    build:
      context: .
      dockerfile: Dockerfile.kali-audit
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artex}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ARTEX_PG_DSN: ${ARTEX_PG_DSN:-}
      ARTEX_AUDIT_LOCAL_ROOTS: /workspaces
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    volumes:
      - artex-data:/app/data
      - artex-pgdata-clean:/var/lib/postgresql/data
      - ./workspaces:/workspaces
    restart: unless-stopped

volumes:
  artex-data:
  artex-pgdata-clean:
